# Development Profile Configuration

# Database Configuration - Oracle (Development)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=videogen_user
spring.datasource.password=videogen_password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging Configuration - More Verbose
logging.level.root=INFO
logging.level.com.videogenerator=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.expiration=86400000

# File Upload Configuration
upload.directory=./uploads
upload.max-file-size=104857600

# Development Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
