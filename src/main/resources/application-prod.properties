# Production Profile Configuration

# Database Configuration - Oracle (Production)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging Configuration - Less Verbose
logging.level.root=WARN
logging.level.com.videogenerator=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# JWT Configuration
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.secret=${JWT_SECRET}

# File Upload Configuration
upload.directory=${UPLOAD_DIR:/var/uploads}
upload.max-file-size=${MAX_FILE_SIZE:104857600}

# Production Server
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# Actuator - Limited endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
